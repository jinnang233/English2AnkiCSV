name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update, for example v0.2.1"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  APP_NAME: english2anki

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            artifact_name: english2anki-windows-x86_64
            binary_name: english2anki.exe
            archive_ext: zip
          - name: macos-aarch64
            os: macos-latest
            artifact_name: english2anki-macos-aarch64
            binary_name: english2anki
            archive_ext: tar.gz
          - name: linux-x86_64
            os: ubuntu-latest
            artifact_name: english2anki-linux-x86_64
            binary_name: english2anki
            archive_ext: tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test

      - name: Build release binary
        run: cargo build --release

      - name: Read package version
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          echo "PACKAGE_VERSION=${version}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${APP_NAME}-${version}-${{ matrix.name }}" >> "${GITHUB_ENV}"

      - name: Prepare package directory
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact_name }}"
          cp "target/release/${{ matrix.binary_name }}" "dist/${{ matrix.artifact_name }}/"
          cp README.md config.example.json "dist/${{ matrix.artifact_name }}/"

      - name: Create Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "dist/${{ matrix.artifact_name }}/*" `
            -DestinationPath "dist/${env:ARCHIVE_NAME}.zip" `
            -Force

      - name: Create Unix archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tar -czf "dist/${ARCHIVE_NAME}.tar.gz" -C "dist/${{ matrix.artifact_name }}" .

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: dist/${{ env.ARCHIVE_NAME }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: VirusTotal Scan
        uses: crazy-max/ghaction-virustotal@v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: |
            dist/*.zip
            dist/*.tar.gz
      - name: Sign release artifacts
        shell: bash
        env:
          SIGN_PRIVATE_KEY: ${{ secrets.RELEASE_SIGN_KEY }}
        run: |
          set -euo pipefail
          shopt -s nullglob

          if [ -z "${SIGN_PRIVATE_KEY:-}" ]; then
            echo "RELEASE_SIGN_KEY is not set; skipping artifact signing."
            exit 0
          fi

          trap 'rm -f private_key.pem; echo "Cleaned up private key."' EXIT
          umask 077
          printf '%s\n' "$SIGN_PRIVATE_KEY" > private_key.pem

          files=(dist/*.zip dist/*.tar.gz)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No release archives found to sign"
            exit 1
          fi

          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            alpine/openssl pkey -pubout -in /work/private_key.pem -out /work/dist/public_key.pem

          for file in "${files[@]}"; do
            docker run --rm \
              -v "$PWD:/work" \
              -w /work \
              alpine/openssl \
              dgst \
              -sign /work/private_key.pem \
              -out "/work/${file}.sign" \
              "/work/${file}"
          done

          rm -f private_key.pem
          ls -la dist

      
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          target_commitish: ${{ github.sha }}
          name: English2Anki ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
