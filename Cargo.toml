[package]
name = "english2anki"
version = "0.2.6"
edition = "2021"
license = "0BSD"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
dirs = "5"
eframe = "0.27"
egui = "0.27"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
rfd = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
